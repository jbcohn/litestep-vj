<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>LiteStep VJ Remote</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=SF+Mono:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: #09090b;
            color: #f1f5f9;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: env(safe-area-inset-top, 10px) 14px env(safe-area-inset-bottom, 16px) 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-x: hidden;
        }

        /* Header Bar */
        .remote-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 2px;
        }

        .remote-brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .remote-brand h1 {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #f87171;
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .status-badge.connected {
            background: rgba(34, 197, 94, 0.15);
            border-color: rgba(34, 197, 94, 0.35);
            color: #4ade80;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 6px currentColor;
        }

        /* Big Flash / Beat Pad */
        .big-pad-btn {
            background: linear-gradient(145deg, #1e1b4b 0%, #312e81 100%);
            border: 1px solid rgba(168, 85, 247, 0.45);
            border-radius: 12px;
            padding: 14px;
            color: #ffffff;
            font-weight: 800;
            font-size: 1.05rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(67, 56, 202, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transition: transform 0.08s ease, filter 0.08s ease;
        }

        .big-pad-btn:active {
            transform: scale(0.97);
            filter: brightness(1.3);
            background: linear-gradient(145deg, #4338ca 0%, #6366f1 100%);
        }

        /* Section Card */
        .control-card {
            background: rgba(18, 18, 26, 0.90);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-title {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Scene Grid */
        .scene-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .scene-item-btn {
            background: #181824;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .scene-item-btn .scene-num {
            font-size: 0.82rem;
            font-weight: 800;
            color: #64748b;
        }

        .scene-item-btn .scene-label {
            font-size: 0.60rem;
            font-weight: 600;
            color: #cbd5e1;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .scene-item-btn.active {
            background: linear-gradient(145deg, #7e22ce 0%, #9333ea 100%);
            border-color: #c084fc;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.45);
        }

        .scene-item-btn.active .scene-num,
        .scene-item-btn.active .scene-label {
            color: #ffffff;
        }

        /* Action Rows & Grids */
        .btn-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }

        .btn-row-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .btn-row-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        .btn-row-6 {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
        }

        .btn-action {
            background: #1e1e2d;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
            font-size: 0.74rem;
            font-weight: 600;
            padding: 8px 6px;
            border-radius: 7px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: background 0.12s ease, transform 0.08s ease;
            text-align: center;
        }

        .btn-action:active {
            background: #2d2d42;
            transform: scale(0.97);
        }

        .btn-action.active {
            background: #9333ea;
            border-color: #c084fc;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
        }

        .btn-action.locked {
            background: #b91c1c;
            border-color: #ef4444;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
        }

        /* High-emphasis Teach Button */
        .btn-teach {
            background: #1e1b4b;
            border: 1.5px solid #6366f1;
            color: #e0e7ff;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 9px 8px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .btn-teach.locked {
            background: #b91c1c;
            border-color: #ef4444;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
        }

        /* Select Dropdowns */
        .remote-select {
            width: 100%;
            background: #181824;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f8fafc;
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 8px 10px;
            border-radius: 7px;
            outline: none;
        }

        /* Current Dance Status Pill */
        .now-playing-pill {
            background: rgba(168, 85, 247, 0.12);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 8px;
            padding: 7px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .np-title {
            font-size: 0.82rem;
            font-weight: 700;
            color: #f0abfc;
        }

        .np-bpm {
            font-size: 0.70rem;
            font-weight: 700;
            color: #38bdf8;
            font-family: 'SF Mono', monospace;
        }

        /* Sensitivity slider row */
        .slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .remote-slider {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            accent-color: #a855f7;
            background: #334155;
            outline: none;
        }

        .slider-val {
            font-size: 0.75rem;
            font-weight: 700;
            font-family: 'SF Mono', monospace;
            color: #38bdf8;
            min-width: 36px;
            text-align: right;
        }

        /* Footer Connection Settings */
        .footer-settings {
            margin-top: 6px;
            padding-top: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.65rem;
            color: #64748b;
        }

        .host-input {
            background: transparent;
            border: 1px solid #334155;
            color: #94a3b8;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            width: 130px;
        }
    </style>
</head>
<body>
    <!-- Top Header -->
    <header class="remote-header">
        <div class="remote-brand">
            <h1>LiteStep VJ Remote</h1>
        </div>
        <div id="status-badge" class="status-badge" onclick="connectWS()" title="Tap to Reconnect">
            <div class="status-dot"></div>
            <span id="status-text">Connecting</span>
        </div>
    </header>

    <!-- Instant Flash / Beat Pad -->
    <button id="btn-flash" class="big-pad-btn" onclick="sendCommand('triggerDropFlash')">
        ⚡ FLASH / DROP
    </button>

    <!-- Scenes Selector (1 to 5) -->
    <div class="control-card">
        <div class="card-title">
            <span>Scenes</span>
            <span id="active-scene-name" style="color: #cbd5e1; font-weight: 600; text-transform: none;">Dancer</span>
        </div>
        <div class="scene-grid">
            <button class="scene-item-btn" id="sbtn-0" onclick="setScene(0)">
                <span class="scene-num">1</span>
                <span class="scene-label">Mandala</span>
            </button>
            <button class="scene-item-btn" id="sbtn-1" onclick="setScene(1)">
                <span class="scene-num">2</span>
                <span class="scene-label">Ridge</span>
            </button>
            <button class="scene-item-btn" id="sbtn-2" onclick="setScene(2)">
                <span class="scene-num">3</span>
                <span class="scene-label">Bubble</span>
            </button>
            <button class="scene-item-btn" id="sbtn-3" onclick="setScene(3)">
                <span class="scene-num">4</span>
                <span class="scene-label">Mount</span>
            </button>
            <button class="scene-item-btn active" id="sbtn-4" onclick="setScene(4)">
                <span class="scene-num">5</span>
                <span class="scene-label">Dancer</span>
            </button>
        </div>

        <div class="btn-row-4">
            <button class="btn-action" id="btn-lock" onclick="sendCommand('toggleSceneLock')">
                <span id="lock-icon">🔄</span> <span id="lock-text">Auto</span>
            </button>
            <button class="btn-action" id="btn-mirror" onclick="sendCommand('toggleMirrorDisplay')">
                <span id="mirror-icon">🪞</span> <span id="mirror-text">Rear Proj</span>
            </button>
            <button class="btn-action" id="btn-blackout" onclick="sendCommand('toggleBlackout')">
                ⬛ Blackout
            </button>
            <button class="btn-action" id="btn-fullscreen" onclick="sendCommand('toggleFullscreen')">
                ⛶ Full
            </button>
        </div>
    </div>

    <!-- Dancer Choreography Controls (Scene 5) -->
    <div class="control-card">
        <div class="card-title">
            <span>Dancer Choreography</span>
            <div style="display:flex; gap:6px;">
                <button class="btn-action" style="padding: 3px 8px; font-size: 0.68rem;" onclick="sendCommand('cycleDanceCadence')">⏱️ Cadence: <span id="dance-cadence-badge">1x</span></button>
                <button class="btn-action" style="padding: 3px 8px; font-size: 0.68rem;" onclick="sendCommand('nextDance')">Next ⏩</button>
            </div>
        </div>

        <!-- Current Playing Dance -->
        <div class="now-playing-pill">
            <span class="np-title" id="now-dance-title">House Basic Bounce</span>
            <span class="np-bpm" id="now-bpm">126 BPM</span>
        </div>

        <!-- TEACH DANCE / HOLD DANCE TOGGLE (User Requested) -->
        <button id="btn-teach-dance" class="btn-teach" onclick="toggleDanceTeachMode()">
            <span id="teach-icon">🔄</span>
            <span id="teach-label">Auto-Advance (Tap to Hold & Teach)</span>
        </button>

        <!-- Dance Dropdown (All 17 Dances) -->
        <select id="sel-dances" class="remote-select" onchange="playSelectedDance(this.value)">
            <option value="house_basic_bounce">House Basic Bounce</option>
            <option value="c_walk_shuffle">C-Walk Shuffle</option>
            <option value="running_man">Running Man (Hip-Hop)</option>
            <option value="roger_rabbit_step">Roger Rabbit Step</option>
            <option value="hip_hop_bounce_roll">Hip-Hop Bounce Roll</option>
            <option value="la_pop_step_groove">LA Pop Step Groove</option>
            <option value="criss_cross_kick">Criss Cross Kick</option>
            <option value="cross_tap_shuffle">Cross Tap Shuffle</option>
            <option value="side_step_slide">Side Step Slide</option>
            <option value="fast_poly_spin">Fast Poly Spin</option>
            <option value="heels_to_toes">Heels To Toes</option>
            <option value="twist_and_heel">Twist and Heel</option>
            <option value="knee_drop_turn">Knee Drop Turn</option>
            <option value="kick_cross_tap">Kick Cross Tap</option>
            <option value="toe_pivot_shuffle">Toe Pivot Shuffle</option>
            <option value="double_down_bounce">Double Down Bounce</option>
            <option value="poly_step_pivot">Poly Step Pivot</option>
        </select>

        <!-- Formations -->
        <div class="card-title" style="margin-top:2px;"><span>Formation</span></div>
        <div class="btn-row-4">
            <button class="btn-action" id="form-1" onclick="setFormation('1')">Solo</button>
            <button class="btn-action" id="form-2_fwd" onclick="setFormation('2_fwd')">Duo</button>
            <button class="btn-action" id="form-2_face" onclick="setFormation('2_face')">Face</button>
            <button class="btn-action" id="form-3" onclick="setFormation('3')">Trio</button>
        </div>

        <!-- Speed Scaling (Power-of-2 Musical Divisions) -->
        <div class="card-title" style="margin-top:2px;"><span>Speed Multiplier</span></div>
        <div class="btn-row-4">
            <button class="btn-action" id="spd-0.5" onclick="setSpeed(0.5)">0.5x</button>
            <button class="btn-action active" id="spd-1.0" onclick="setSpeed(1.0)">1.0x</button>
            <button class="btn-action" id="spd-2.0" onclick="setSpeed(2.0)">2.0x</button>
            <button class="btn-action" id="spd-4.0" onclick="setSpeed(4.0)">4.0x</button>
        </div>

        <!-- Camera Angle Presets -->
        <div class="card-title" style="margin-top:2px;"><span>Camera Angle</span></div>
        <div class="btn-row-6">
            <button class="btn-action active" id="cam-orbit" onclick="setCameraAngle('orbit')">Orbit</button>
            <button class="btn-action" id="cam-orbit_paused" onclick="setCameraAngle('orbit_paused')">⏸</button>
            <button class="btn-action" id="cam-front" onclick="setCameraAngle('front')">Front</button>
            <button class="btn-action" id="cam-three_quarter" onclick="setCameraAngle('three_quarter')">3/4</button>
            <button class="btn-action" id="cam-side" onclick="setCameraAngle('side')">Side</button>
            <button class="btn-action" id="cam-top" onclick="setCameraAngle('top')">Top</button>
        </div>

        <!-- Pose Mode -->
        <div class="card-title" style="margin-top:2px;"><span>Pose Mode & Outfits</span></div>
        <div class="btn-row-4">
            <button class="btn-action active" id="pm-dance" onclick="setPoseMode('dance')">Dance</button>
            <button class="btn-action" id="pm-pause" onclick="setPoseMode('pause')">Pause</button>
            <button class="btn-action" id="pm-tpose" onclick="setPoseMode('tpose')">T-Pose</button>
            <button class="btn-action" id="pm-apose" onclick="setPoseMode('apose')">A-Pose</button>
        </div>
        <button class="btn-action" onclick="sendCommand('cycleOutfit')">
            👕 Next Outfit (<span id="outfit-name-badge">Cyber Carnival</span>)
        </button>
    </div>

    <!-- Mountain Controls (Scenes 2 & 4) -->
    <div class="control-card">
        <div class="card-title">
            <span>Mountain Topography</span>
            <span id="terrain-name-badge" style="color:#38bdf8; font-weight:700;">Nebo</span>
        </div>
        <div class="btn-row">
            <button class="btn-action" onclick="sendCommand('cycleTerrain')">
                🏔️ Next Peak
            </button>
            <button class="btn-action" onclick="sendCommand('cycleMountainCadence')">
                ⏱️ Cadence (<span id="terrain-cadence-badge">32B</span>)
            </button>
        </div>
    </div>

    <!-- Audio & Sensitivity Controls -->
    <div class="control-card">
        <div class="card-title">
            <span>Audio & Tap Tempo</span>
        </div>
        <div class="btn-row">
            <button class="btn-action" id="btn-audio-toggle" onclick="sendCommand('toggleAudio')">
                🎤 Live Mic
            </button>
            <button class="btn-action" onclick="sendCommand('tapTempo')" style="font-weight: 700;">
                🥁 Tap Tempo
            </button>
        </div>
        <div class="slider-row">
            <span style="font-size: 0.72rem; color: #94a3b8;">Sens</span>
            <input type="range" class="remote-slider" id="slider-sens" min="0.2" max="3.0" step="0.1" value="1.0" oninput="onSensitivityChange(this.value)">
            <span class="slider-val" id="val-sens">1.0x</span>
        </div>
    </div>

    <!-- Dance Title Display Controls -->
    <div class="control-card">
        <div class="card-title">
            <span>Dance Name Title Style</span>
            <div style="display:flex; gap:6px;">
                <button class="btn-action" id="btn-toggle-title" style="padding: 2px 8px; font-size: 0.65rem;" onclick="toggleDanceTitle()">Title: ON</button>
                <button class="btn-action" style="padding: 2px 8px; font-size: 0.65rem;" onclick="previewDanceTitle()">Preview</button>
            </div>
        </div>
        <div class="btn-row-3">
            <button class="btn-action" id="style-minimal" onclick="setTitleStyle('minimal')">Minimal</button>
            <button class="btn-action active" id="style-lower_third" onclick="setTitleStyle('lower_third')">Lower 3rd</button>
            <button class="btn-action" id="style-center_pop" onclick="setTitleStyle('center_pop')">Center Pop</button>
        </div>
        <div class="btn-row">
            <button class="btn-action" id="style-neon_glow" onclick="setTitleStyle('neon_glow')">Neon Glow</button>
            <button class="btn-action" id="style-marquee" onclick="setTitleStyle('marquee')">Marquee</button>
        </div>
    </div>

    <!-- Footer Host Config -->
    <footer class="footer-settings">
        <span>LiteStep VJ Direct LAN Remote</span>
        <div>
            Host: <input type="text" id="host-ip" class="host-input" value="">
        </div>
    </footer>

    <script>
        let ws = null;
        let reconnectTimer = null;
        let currentHost = window.location.hostname || "127.0.0.1";
        let isDanceLocked = false;
        document.getElementById("host-ip").value = currentHost;

        document.getElementById("host-ip").addEventListener("change", (e) => {
            currentHost = e.target.value.trim();
            connectWS();
        });

        function vibrate() {
            if (navigator.vibrate) navigator.vibrate(20);
        }

        function connectWS() {
            if (ws) {
                try { ws.close(); } catch(e) {}
            }
            if (reconnectTimer) clearTimeout(reconnectTimer);

            const badge = document.getElementById("status-badge");
            const text = document.getElementById("status-text");
            text.textContent = "Connecting";
            badge.classList.remove("connected");

            const wsUrl = `ws://${currentHost}:8001`;
            try {
                ws = new WebSocket(wsUrl);
            } catch (err) {
                console.error("WS error:", err);
                scheduleReconnect();
                return;
            }

            ws.onopen = () => {
                badge.classList.add("connected");
                text.textContent = "Connected";
                console.log("[Remote] Connected to MacBook VJ!");
                ws.send(JSON.stringify({ type: "get_state" }));
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleIncomingState(data);
                } catch (e) {
                    console.error("Parse error:", e);
                }
            };

            ws.onclose = () => {
                badge.classList.remove("connected");
                text.textContent = "Offline";
                scheduleReconnect();
            };

            ws.onerror = () => {
                badge.classList.remove("connected");
                text.textContent = "Error";
            };
        }

        function scheduleReconnect() {
            if (reconnectTimer) clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(() => {
                connectWS();
            }, 2000);
        }

        function sendCommand(action, params = {}) {
            vibrate();
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                console.warn("WS not open, connecting...");
                connectWS();
                return;
            }
            const payload = { type: "command", action, ...params };
            ws.send(JSON.stringify(payload));
        }

        function setScene(idx) {
            sendCommand("setScene", { sceneIdx: idx });
            updateSceneUI(idx);
        }

        function setFormation(form) {
            sendCommand("setFormation", { formation: form });
            ["1", "2_fwd", "2_face", "3"].forEach((f) => {
                const b = document.getElementById("form-" + f);
                if (b) b.classList.toggle("active", f === form);
            });
        }

        function setSpeed(spd) {
            sendCommand("setSpeed", { speed: spd });
            [0.5, 1.0, 2.0, 4.0].forEach((s) => {
                const b = document.getElementById("spd-" + s.toFixed(1));
                if (b) b.classList.toggle("active", Math.abs(s - spd) < 0.05);
            });
        }

        function setCameraAngle(angle) {
            sendCommand("setCameraAngle", { angle });
            ["orbit", "orbit_paused", "front", "three_quarter", "side", "top"].forEach((a) => {
                const b = document.getElementById("cam-" + a);
                if (b) b.classList.toggle("active", a === angle);
            });
        }

        function setPoseMode(mode) {
            sendCommand("setPoseMode", { mode });
            ["dance", "pause", "tpose", "apose"].forEach((m) => {
                const b = document.getElementById("pm-" + m);
                if (b) b.classList.toggle("active", m === mode);
            });
        }

        let isDanceTitleEnabled = true;
        function toggleDanceTitle() {
            isDanceTitleEnabled = !isDanceTitleEnabled;
            sendCommand("toggleDanceTitle", { enabled: isDanceTitleEnabled });
            updateDanceTitleUI(isDanceTitleEnabled);
        }

        function updateDanceTitleUI(enabled) {
            isDanceTitleEnabled = enabled;
            const btn = document.getElementById("btn-toggle-title");
            if (btn) {
                btn.textContent = enabled ? "Title: ON" : "Title: OFF";
                btn.classList.toggle("active", enabled);
            }
        }

        function setTitleStyle(style) {
            sendCommand("setDanceTitleStyle", { style });
            ["minimal", "lower_third", "center_pop", "neon_glow", "marquee"].forEach((s) => {
                const b = document.getElementById("style-" + s);
                if (b) b.classList.toggle("active", s === style);
            });
            updateDanceTitleUI(true);
        }

        function previewDanceTitle() {
            const activeStyle = document.querySelector(".btn-action.active[id^='style-']")?.id.replace("style-", "") || "lower_third";
            sendCommand("setDanceTitleStyle", { style: activeStyle });
            updateDanceTitleUI(true);
        }

        function toggleDanceTeachMode() {
            isDanceLocked = !isDanceLocked;
            sendCommand("toggleDanceLock", { locked: isDanceLocked });
            updateTeachUI(isDanceLocked);
        }

        function updateTeachUI(locked) {
            isDanceLocked = locked;
            const btn = document.getElementById("btn-teach-dance");
            const icon = document.getElementById("teach-icon");
            const label = document.getElementById("teach-label");
            if (locked) {
                btn.classList.add("locked");
                icon.textContent = "🔒";
                label.textContent = "HOLDING DANCE (Teach Mode: Active)";
            } else {
                btn.classList.remove("locked");
                icon.textContent = "🔄";
                label.textContent = "Auto-Advance (Tap to Hold & Teach)";
            }
        }

        function playSelectedDance(clipId) {
            sendCommand("playDance", { clipId });
        }

        function onSensitivityChange(val) {
            const num = parseFloat(val);
            document.getElementById("val-sens").textContent = num.toFixed(1) + "x";
            sendCommand("setSensitivity", { sensitivity: num });
        }

        function updateSceneUI(idx) {
            const names = ["Mandala", "Ridgelines", "Bubbles", "Mountain", "Dancer"];
            for (let i = 0; i < 5; i++) {
                const b = document.getElementById("sbtn-" + i);
                if (b) b.classList.toggle("active", i === idx);
            }
            const nameEl = document.getElementById("active-scene-name");
            if (nameEl) nameEl.textContent = names[idx] || "Scene " + (idx + 1);
        }

        function handleIncomingState(data) {
            if (data.type === "state" || data.type === "state_update") {
                if (data.sceneIdx !== undefined) updateSceneUI(data.sceneIdx);

                if (data.sceneLock !== undefined) {
                    const lockBtn = document.getElementById("btn-lock");
                    const icon = document.getElementById("lock-icon");
                    const text = document.getElementById("lock-text");
                    if (data.sceneLock) {
                        lockBtn.classList.add("locked");
                        icon.textContent = "🔒";
                        text.textContent = "Hold";
                    } else {
                        lockBtn.classList.remove("locked");
                        icon.textContent = "🔄";
                        text.textContent = "Auto";
                    }
                }

                if (data.danceLocked !== undefined) {
                    updateTeachUI(data.danceLocked);
                }

                if (data.blackout !== undefined) {
                    const blackBtn = document.getElementById("btn-blackout");
                    if (blackBtn) blackBtn.classList.toggle("active", data.blackout);
                }

                if (data.mirrored !== undefined) {
                    const mirBtn = document.getElementById("btn-mirror");
                    const mirText = document.getElementById("mirror-text");
                    if (mirBtn) {
                        mirBtn.classList.toggle("active", data.mirrored);
                        if (mirText) mirText.textContent = data.mirrored ? "Mirrored" : "Rear Proj";
                    }
                }

                if (data.audioLive !== undefined) {
                    const audBtn = document.getElementById("btn-audio-toggle");
                    if (audBtn) {
                        audBtn.classList.toggle("active", data.audioLive);
                        audBtn.textContent = data.audioLive ? "🎤 Live Mic: ON" : "🎤 Sim Beat";
                    }
                }

                if (data.danceTitle) {
                    const dt = document.getElementById("now-dance-title");
                    if (dt) dt.textContent = data.danceTitle;
                }

                if (data.danceClip) {
                    const sel = document.getElementById("sel-dances");
                    if (sel) sel.value = data.danceClip;
                }

                if (data.bpm) {
                    const bpmEl = document.getElementById("now-bpm");
                    if (bpmEl) bpmEl.textContent = Math.round(data.bpm) + " BPM";
                }

                if (data.terrainName) {
                    const tb = document.getElementById("terrain-name-badge");
                    if (tb) tb.textContent = data.terrainName;
                }

                if (data.terrainCadence) {
                    const cb = document.getElementById("terrain-cadence-badge");
                    if (cb) cb.textContent = data.terrainCadence;
                }

                if (data.danceCadence) {
                    const dcb = document.getElementById("dance-cadence-badge");
                    if (dcb) dcb.textContent = data.danceCadence;
                }

                if (data.outfitName) {
                    const ob = document.getElementById("outfit-name-badge");
                    if (ob) ob.textContent = data.outfitName;
                }

                if (data.formation) {
                    ["1", "2_fwd", "2_face", "3"].forEach((f) => {
                        const b = document.getElementById("form-" + f);
                        if (b) b.classList.toggle("active", f === data.formation);
                    });
                }

                if (data.speed !== undefined) {
                    [0.5, 1.0, 2.0, 4.0].forEach((s) => {
                        const b = document.getElementById("spd-" + s.toFixed(1));
                        if (b) b.classList.toggle("active", Math.abs(s - data.speed) < 0.05);
                    });
                }

                if (data.cameraAngle) {
                    ["orbit", "orbit_paused", "front", "three_quarter", "side", "top"].forEach((a) => {
                        const b = document.getElementById("cam-" + a);
                        if (b) b.classList.toggle("active", a === data.cameraAngle);
                    });
                }

                if (data.poseMode) {
                    ["dance", "pause", "tpose", "apose"].forEach((m) => {
                        const b = document.getElementById("pm-" + m);
                        if (b) b.classList.toggle("active", m === data.poseMode);
                    });
                }

                if (data.danceTitleEnabled !== undefined) {
                    updateDanceTitleUI(data.danceTitleEnabled);
                }

                if (data.danceTitleStyle) {
                    ["minimal", "lower_third", "center_pop", "neon_glow", "marquee"].forEach((s) => {
                        const b = document.getElementById("style-" + s);
                        if (b) b.classList.toggle("active", s === data.danceTitleStyle);
                    });
                }

                if (data.sensitivity !== undefined) {
                    const sl = document.getElementById("slider-sens");
                    const sv = document.getElementById("val-sens");
                    if (sl) sl.value = data.sensitivity;
                    if (sv) sv.textContent = data.sensitivity.toFixed(1) + "x";
                }
            }
        }

        // Initialize connection on load
        window.addEventListener("DOMContentLoaded", () => {
            connectWS();
        });
    </script>
</body>
</html>
